version: 0.2
phases:
  pre_build:
    commands:
      - set -euo pipefail
      - export CI=true
      - export YARN_ENABLE_TELEMETRY=0
      - export DISABLE_OPENCOLLECTIVE=1
      - export ADBLOCK=1
      - |
        if [[ -z "${GITHUB_TOKEN:-}" ]]; then
          echo "❌ ERROR: GITHUB_TOKEN is not set"
          exit 1
        fi
        echo "✅ GITHUB_TOKEN is configured"
      - echo "=== INITIALIZING GIT REPOSITORY ==="
      - |
        # Initialize git and configure authentication
        git init
        git remote add origin https://github.com/capsule-org/web-sdk.git
        git config credential.helper '!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f'
        echo "✅ Git initialized and authenticated"
      - echo "=== CHECKING FOR EXISTING PUBLISH PR ==="
      - |
        EXISTING_PR=$(gh pr list --state open --search "chore: Publish in:title" --json number,url --jq '.[0]')
        if [[ "$EXISTING_PR" != "null" && -n "$EXISTING_PR" ]]; then
          PR_NUM=$(echo $EXISTING_PR | jq -r '.number')
          PR_URL=$(echo $EXISTING_PR | jq -r '.url')
          echo "❌ ERROR: A publish PR is already open!"
          echo "❌ PR $PR_NUM: $PR_URL"
          echo "❌ Please wait for the existing release to complete or close that PR before starting a new release."
          exit 1
        fi
        echo "✅ No existing publish PR found - proceeding with release"
      - echo "=== FREEZING ALL EXISTING PRS ==="
      - |
        for PR in $(gh pr list --state open --json number,title --jq '.[] | select(.title != "chore: Publish") | .number'); do
          SHA=$(gh pr view $PR --json headRefOid --jq '.headRefOid')
          gh api repos/capsule-org/web-sdk/statuses/$SHA \
            -f state=failure \
            -f context="release-gate" \
            -f description="Release in progress - merging blocked" || true
          echo "✅ Blocked PR $PR"
        done
      - echo "=== PREPARING VERSION BUMP ==="
      - git config user.name "Capsule Bot"
      - git config user.email "bot@usecapsule.com"
      - git fetch origin 2.0.0-alpha
      - git checkout -f -b 2.0.0-alpha origin/2.0.0-alpha
      - SOURCE_SHA=$(git rev-parse HEAD)
      - 'echo "Source commit: $SOURCE_SHA"'
  build:
    commands:
      - export NODE_ENV=production
      - echo "Installing Node.js 22.17.0..."
      - |
        # Install nvm
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        # Install and use Node 22.17.0
        nvm install 22.17.0
        nvm use 22.17.0
        node --version
        echo "✅ Node.js 22.17.0 installed"
      - echo "Enabling Corepack for Yarn version management..."
      - corepack enable
      - echo "Installing dependencies..."
      - yarn install --frozen-lockfile --ignore-scripts
      - echo "Building packages..."
      - |
        # Add node_modules/.bin to PATH and build
        export PATH="$PWD/node_modules/.bin:$PATH"
        yarn build:dev
      - echo "Calculating next version..."
      - "PUBLISHED_VERSION=$(npm view @getpara/react-sdk-lite version --registry https://registry.npmjs.org/)"
      - 'echo "Published version: $PUBLISHED_VERSION"'
      - ALPHA_NUM=$(echo $PUBLISHED_VERSION | grep -oP 'alpha\.\K\d+')
      - NEXT_ALPHA=$((ALPHA_NUM + 1))
      - BASE_VERSION=$(echo $PUBLISHED_VERSION | grep -oP '^\d+\.\d+\.\d+')
      - NEXT_VERSION="${BASE_VERSION}-alpha.${NEXT_ALPHA}"
      - 'echo "Next version: $NEXT_VERSION"'
      - BRANCH_NAME="publish-${NEXT_VERSION}"
      - 'echo "Creating branch: $BRANCH_NAME"'
      - git checkout -b $BRANCH_NAME
      - echo "Running yarn alpha-version..."
      - yarn alpha-version
      - echo "Committing changes..."
      - 'git commit -a -m "chore: bump version to ${NEXT_VERSION}"'
      - git push -u origin $BRANCH_NAME
      - echo "Creating publish PR..."
      - |
        gh pr create \
          --title "chore: Publish" \
          --body "Automated alpha publish for ${NEXT_VERSION}

        Review the ALPHA-CHANGELOG.md for changes included in this release." \
          --base 2.0.0-alpha \
          --head $BRANCH_NAME \
          --label "automated,alpha-publish"
      - PR_NUMBER=$(gh pr view $BRANCH_NAME --json number --jq '.number')
      - PR_URL=$(gh pr view $BRANCH_NAME --json url --jq '.url')
      - echo "✅ Created PR $PR_NUMBER - $PR_URL"
      - echo "PR_NUMBER=$PR_NUMBER" >> version-info.txt
      - echo "NEXT_VERSION=$NEXT_VERSION" >> version-info.txt
      - echo "BRANCH_NAME=$BRANCH_NAME" >> version-info.txt
      - echo "PR_URL=$PR_URL" >> version-info.txt
      - echo "SOURCE_SHA=$SOURCE_SHA" >> version-info.txt
artifacts:
  files:
    - version-info.txt
