version: 0.2
phases:
  pre_build:
    commands:
      - set -euo pipefail
      - export CI=true
      - export YARN_ENABLE_TELEMETRY=0
      - export DISABLE_OPENCOLLECTIVE=1
      - export ADBLOCK=1
      - |
        if [[ -z "${GITHUB_TOKEN:-}" ]]; then
          echo "❌ ERROR: GITHUB_TOKEN is not set"
          exit 1
        fi
        if [[ -z "${NPM_TOKEN:-}" ]]; then
          echo "❌ ERROR: NPM_TOKEN is not set"
          exit 1
        fi
        echo "✅ Tokens are configured"
      - echo "=== INITIALIZING GIT REPOSITORY ==="
      - |
        # Initialize git and configure authentication
        git init
        git remote add origin https://github.com/capsule-org/web-sdk.git
        git config credential.helper '!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f'
        echo "✅ Git initialized and authenticated"
      - source version-info.txt
      - 'echo "Publishing version: $NEXT_VERSION"'
      - |
        # Configure NPM auth (token is automatically masked in logs)
        echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        chmod 600 ~/.npmrc
  build:
    commands:
      - export NODE_ENV=production
      - echo "Checking out merged code..."
      - git config user.name "Capsule Bot"
      - git config user.email "bot@usecapsule.com"
      - git fetch origin 2.0.0-alpha
      - git checkout -f -b 2.0.0-alpha origin/2.0.0-alpha
      - echo "Verifying commit history..."
      - CURRENT_SHA=$(git rev-parse HEAD)
      - PARENT_SHA=$(git rev-parse HEAD^)
      - 'echo "Current HEAD: $CURRENT_SHA"'
      - 'echo "Parent commit: $PARENT_SHA"'
      - 'echo "Expected source: $SOURCE_SHA"'
      - |
        if [[ "$PARENT_SHA" != "$SOURCE_SHA" ]]; then
          echo "❌ ERROR: Unexpected commits detected!"
          echo "❌ Expected parent: $SOURCE_SHA"
          echo "❌ Actual parent: $PARENT_SHA"
          echo "❌ This means commits were pushed between merge and publish"
          exit 1
        fi
        echo "✅ Commit history verified - no unexpected commits"
      - echo "Installing Node.js 22.17.0..."
      - |
        # Install nvm
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        # Install and use Node 22.17.0
        nvm install 22.17.0
        nvm use 22.17.0
        node --version
        echo "✅ Node.js 22.17.0 installed"
      - echo "Enabling Corepack for Yarn version management..."
      - corepack enable
      - echo "Installing dependencies..."
      - yarn install --frozen-lockfile --ignore-scripts
      - echo "Building packages..."
      - |
        # Add node_modules/.bin to PATH and build
        export PATH="$PWD/node_modules/.bin:$PATH"
        yarn build:dev
      - echo "Publishing to NPM with alpha tag..."
      - yarn alpha-publish
  post_build:
    commands:
      - echo "✅ Published version $NEXT_VERSION to NPM"
      - rm -f ~/.npmrc # Clean up token file
