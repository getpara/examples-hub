        uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          role-session-name: github-upload-sandbox-artifacts
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Trace Report
        if: failure()
        env:
          BUCKET_NAME: capsule-sandbox-artifacts-site
          RUN_ID: ${{ github.run_id }}
        run: aws s3 sync playwright-report "s3://${BUCKET_NAME}/e2e-runs/${RUN_ID}/external-wallets"

      - name: Trace Report URL
        if: failure()
        run: echo "View failed test artifacts at https://artifacts.sandbox.usecapsule.com/e2e-runs/${{ github.run_id }}/external-wallets/index.html"

  e2e-examples-hub-react-vite:
    runs-on: FourCoreRunner
    needs: build
