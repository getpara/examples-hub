        run: npx playwright install chromium

      - name: Cache Synpress wallet setup
        uses: actions/cache@v4
        with:
          path: .cache-synpress
          key: ${{ runner.os }}-synpress-${{ hashFiles('e2e/external-wallets/wallet-setup/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-synpress-

      - name: Generate wallet cache
        run: yarn e2e:cache-wallets

      - name: Run external wallets E2E tests
        run: xvfb-run yarn e2e:external-wallets

      - name: Configure AWS credentials
