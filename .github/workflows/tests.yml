name: Tests

on:
  pull_request:
    branches:
      - main
      - 2.0.0-alpha
  workflow_dispatch:
    inputs:
      examples_hub_ref:
        description: 'Examples Hub PR number or branch name (e.g., "123" or "my-branch"; defaults to "2.0.0-alpha")'
        required: false
        type: string
        default: '2.0.0-alpha'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: FourCoreRunner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up cache key prefix
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CACHE_KEY_PREFIX=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "CACHE_KEY_PREFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-
      - name: Install dependencies
        run: yarn

      - name: Run Lint
        run: yarn lint

      - name: Nx cache
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-
      - name: Build packages
        run: yarn build
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

  unit-test:
    runs-on: FourCoreRunner
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.3'

      - name: Set up cache key prefix
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CACHE_KEY_PREFIX=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "CACHE_KEY_PREFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
      - name: Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-
      - name: Nx cache
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}-tests
          restore-keys: |
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-
      - name: Build packages
        run: yarn build
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

      - name: Configure puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run tests
        run: yarn test
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

  e2e-test:
    runs-on: FourCoreRunner
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.3'

      - name: Set up cache key prefix
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CACHE_KEY_PREFIX=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "CACHE_KEY_PREFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
      - name: Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-
      - name: Nx cache
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-
      - name: Build packages
        run: yarn build
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

      - name: Build MPC Worker
        run: yarn build
        working-directory: ./workers/mpc-worker

      - name: Build Server MPC Worker
        run: yarn build
        working-directory: ./workers/server-mpc-worker

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: xvfb-run npx playwright test --headed

      - name: Configure AWS credentials
        if: failure()
        uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          role-session-name: github-upload-sandbox-artifacts
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Trace Report
        if: failure()
        env:
          BUCKET_NAME: capsule-sandbox-artifacts-site
          RUN_ID: ${{ github.run_id }}
        run: aws s3 sync playwright-report "s3://${BUCKET_NAME}/e2e-runs/${RUN_ID}/legacy-example"

      - name: Trace Report URL
        if: failure()
        run: echo "View failed test artifacts at https://artifacts.sandbox.usecapsule.com/e2e-runs/${{ github.run_id }}/legacy-example/index.html"

  e2e-examples-hub:
    runs-on: FourCoreRunner
    needs: build
    permissions:
      id-token: write
      contents: read
    env:
      NODE_OPTIONS: '--max_old_space_size=14336'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Set up cache key prefix
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CACHE_KEY_PREFIX=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "CACHE_KEY_PREFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-

      - uses: actions/cache@v4
        id: nx-cache
        with:
          path: .nx
          key: ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: |
            ~/.cache/puppeteer
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-browsers-${{ hashFiles('yarn.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-browsers-

      - name: Install test browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          npx puppeteer browsers install chrome
          npx playwright install chromium

      - name: Build packages
        run: yarn build
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

      - name: Build MPC Worker
        run: yarn build
        working-directory: ./workers/mpc-worker

      - name: Build Server MPC Worker  
        run: yarn build
        working-directory: ./workers/server-mpc-worker

      - name: Determine Examples Hub branch
        id: get-branch
        run: |
          REF="${{ github.event.inputs.examples_hub_ref || '2.0.0-alpha' }}"
          if [[ "$REF" =~ ^[0-9]+$ ]]; then
            BRANCH="pull/$REF/head"
            echo "📌 Using Examples Hub PR #$REF"
          else
            BRANCH="$REF"
            echo "🌿 Using Examples Hub branch: $REF"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Run examples-hub E2E tests
        run: |
          export PLAYWRIGHT_HTML_REPORT=./playwright-report
          xvfb-run -a yarn e2e-examples-hub --branch "${{ steps.get-branch.outputs.branch }}" --verbose
        env:
          CI: true
          SHELL: /bin/bash
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true

      - name: Configure AWS credentials
        if: failure()
        uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          role-session-name: github-upload-sandbox-artifacts
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Trace Report
        if: failure()
        env:
          BUCKET_NAME: capsule-sandbox-artifacts-site
          RUN_ID: ${{ github.run_id }}
        run: aws s3 sync playwright-report "s3://${BUCKET_NAME}/e2e-runs/${RUN_ID}/examples-hub"

      - name: Trace Report URL
        if: failure()
        run: echo "View failed test artifacts at https://artifacts.sandbox.usecapsule.com/e2e-runs/${{ github.run_id }}/examples-hub/index.html"