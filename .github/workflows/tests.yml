      - name: Build MPC Worker
        run: yarn build
        working-directory: ./workers/mpc-worker

      - name: Build Server MPC Worker
        run: yarn build
        working-directory: ./workers/server-mpc-worker

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Cache Synpress wallet setup
        uses: actions/cache@v4
        with:
          path: .cache-synpress
          key: ${{ runner.os }}-synpress-${{ hashFiles('e2e/external-wallets/wallet-setup/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-synpress-

      - name: Generate wallet cache
        run: yarn e2e:cache-wallets

      - name: Run external wallets E2E tests
        run: xvfb-run yarn e2e:external-wallets

      - name: Configure AWS credentials
        if: failure()
        uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          role-session-name: github-upload-sandbox-artifacts
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Trace Report
        if: failure()
        env:
          BUCKET_NAME: capsule-sandbox-artifacts-site
          RUN_ID: ${{ github.run_id }}
        run: aws s3 sync playwright-report "s3://${BUCKET_NAME}/e2e-runs/${RUN_ID}/external-wallets"

      - name: Trace Report URL
        if: failure()
        run: echo "View failed test artifacts at https://artifacts.sandbox.usecapsule.com/e2e-runs/${{ github.run_id }}/external-wallets/index.html"

  e2e-examples-hub-react-vite:
    runs-on: FourCoreRunner
    needs: build
    permissions:
      id-token: write
      contents: read
    env:
      NODE_OPTIONS: '--max_old_space_size=14336'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Set up cache key prefix
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CACHE_KEY_PREFIX=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "CACHE_KEY_PREFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
