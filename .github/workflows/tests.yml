name: Tests

on:
  pull_request:
    branches:
      - main
      - 2.0.0-alpha
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: FourCoreRunner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up cache key prefix
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CACHE_KEY_PREFIX=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "CACHE_KEY_PREFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-
      - name: Install dependencies
        run: yarn

      - name: Run Lint
        run: yarn lint

      - name: Nx cache
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-
      - name: Build packages
        run: yarn build
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

  unit-test:
    runs-on: FourCoreRunner
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Set up cache key prefix
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CACHE_KEY_PREFIX=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "CACHE_KEY_PREFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
      - name: Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-
      - name: Nx cache
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}-tests
          restore-keys: |
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-
      - name: Build packages
        run: yarn build
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

      - name: Configure puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run tests
        run: yarn test
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

  e2e-test:
    runs-on: FourCoreRunner
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Set up cache key prefix
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CACHE_KEY_PREFIX=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "CACHE_KEY_PREFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
      - name: Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.CACHE_KEY_PREFIX }}-
      - name: Nx cache
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-
      - name: Build packages
        run: yarn build
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

      - name: Build MPC Worker
        run: yarn build
        working-directory: ./workers/mpc-worker

      - name: Build Server MPC Worker
        run: yarn build
        working-directory: ./workers/server-mpc-worker

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run legacy E2E tests
        run: xvfb-run yarn e2e:legacy --headed

      - name: Configure AWS credentials
        if: failure()
        uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          role-session-name: github-upload-sandbox-artifacts
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Trace Report
        if: failure()
        env:
          BUCKET_NAME: capsule-sandbox-artifacts-site
          RUN_ID: ${{ github.run_id }}
        run: aws s3 sync playwright-report "s3://${BUCKET_NAME}/e2e-runs/${RUN_ID}/legacy-example"

      - name: Trace Report URL
        if: failure()
        run: echo "View failed test artifacts at https://artifacts.sandbox.usecapsule.com/e2e-runs/${{ github.run_id }}/legacy-example/index.html"

