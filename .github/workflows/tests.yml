          key: ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nx-dir-${{ env.CACHE_KEY_PREFIX }}-

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: |
            ~/.cache/puppeteer
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-browsers-${{ hashFiles('yarn.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-browsers-

      - name: Install test browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          npx puppeteer browsers install chrome
          npx playwright install chromium

      - name: Build packages
        run: yarn build
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true
          NODE_OPTIONS: '--max_old_space_size=14336'

      - name: Build MPC Worker
        run: yarn build
        working-directory: ./workers/mpc-worker

      - name: Build Server MPC Worker
        run: yarn build
        working-directory: ./workers/server-mpc-worker

      - name: Determine Examples Hub branch
        id: get-branch
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Check if this is a PR and extract branch from PR body
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Extract examples-hub-branch from PR body via environment variable (safer)
            PR_BRANCH=$(echo "$PR_BODY" | grep -oP 'examples-hub-branch:\s*\K[^\s]+' | head -1 || echo "")
            echo "DEBUG: Extracted PR_BRANCH='$PR_BRANCH'"

            if [[ -n "$PR_BRANCH" ]]; then
              REF="$PR_BRANCH"
              echo "📝 Using Examples Hub branch from PR body: $REF"
            else
              REF="2.0.0-alpha"
              echo "📦 Using default Examples Hub branch: 2.0.0-alpha"
            fi
          else
            # Manual workflow dispatch
            REF="${{ github.event.inputs.examples_hub_ref || '2.0.0-alpha' }}"
            echo "🔧 Manual trigger with ref: $REF"
          fi

          # Handle PR numbers vs branch names (existing logic)
          if [[ "$REF" =~ ^[0-9]+$ ]]; then
            BRANCH="pull/$REF/head"
            echo "📌 Using Examples Hub PR #$REF"
          else
            BRANCH="$REF"
            echo "🌿 Using Examples Hub branch: $REF"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "::notice::Examples Hub branch resolved to: $BRANCH"

      - name: Run react-vite E2E tests
        run: |
          export PLAYWRIGHT_HTML_REPORT=./playwright-report
          xvfb-run -a yarn e2e:examples-hub --branch "${{ steps.get-branch.outputs.branch }}" --framework react-vite --verbose
        env:
          CI: true
          SHELL: /bin/bash
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
          NX_IGNORE_MACHINE_CACHE: true

      - name: Configure AWS credentials
        if: failure()
        uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          role-session-name: github-upload-sandbox-artifacts
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Trace Report
        if: failure()
        env:
          BUCKET_NAME: capsule-sandbox-artifacts-site
          RUN_ID: ${{ github.run_id }}
        run: aws s3 sync playwright-report "s3://${BUCKET_NAME}/e2e-runs/${RUN_ID}/examples-hub-react-vite"

      - name: Trace Report URL
        if: failure()
        run: echo "View failed test artifacts at https://artifacts.sandbox.usecapsule.com/e2e-runs/${{ github.run_id }}/examples-hub-react-vite/index.html"

