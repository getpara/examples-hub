name: PR Format
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR description
        id: get-pr-description
        uses: actions/github-script@v5
        with:
          script: |
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            return Buffer.from(data.body).toString('base64');

      - name: Check checklist completion
        run: |
          description_b64="${{ steps.get-pr-description.outputs.result }}"
          if echo "$description_b64" | base64 --decode | grep -q '\-\ \[\ \]'; then
            echo "Not all checklist items are checked."
            exit 1
          else
            echo "All checklist items are checked."
          fi

  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
