name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # Delete any previous Claude review comments to prevent spam
      - name: Clean up old review comments
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          # Find all comments with our review signature
          COMMENT_IDS=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments | map(select(.body | test("🔍 PR Review Summary")) | select(.author.login == "github-actions" or .author.login == "claude")) | .[].id')
          
          # Delete each old comment
          for comment_id in $COMMENT_IDS; do
            echo "Deleting old review comment: $comment_id"
            gh api -X DELETE "/repos/${{ github.repository }}/issues/comments/$comment_id"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          max_turns: "30"
          timeout_minutes: 15
          custom_instructions: |
            You are reviewing a Para Web SDK PR. Follow the comprehensive review guidelines in .github/prompts/comprehensive-pr-review.md.
            
            Focus on HIGH severity issues only:
            - SSR compatibility breaks
            - Security vulnerabilities  
            - Missing error handling on public APIs
            - Bundle size increases >10KB
            - Breaking API changes
            
            CRITICAL FORMAT RULES:
            - Use "Issue 1:" format, not "#1" (GitHub interprets # as PR references)
            - Always include "Checks Performed" section showing all 6 areas
            - Always include the tip about using @claude fix at the bottom
            - Use EXACT format from prompt, no extra sections
            
            Only report if you find high-severity issues. If none found, just react with ✅.
          direct_prompt: |
            Review this PR for the Para Web SDK focusing on high-severity issues only:
            1. Module safety (SSR breaks, side effects, global mutations)
            2. Security issues and missing error handling
            3. Bundle size impact and dependency issues
            4. Breaking API changes
            
            Use "Issue 1:" format (not #1) and include @claude fix tip at bottom.
