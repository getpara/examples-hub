name: Manual Unfreeze PRs

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "UNFREEZE" to confirm'
        required: true
        type: string

jobs:
  unfreeze-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [[ "${{ github.event.inputs.confirmation }}" != "UNFREEZE" ]]; then
            echo "❌ Confirmation failed. You must type 'UNFREEZE' to proceed."
            exit 1
          fi
          echo "✅ Confirmation validated"

      - name: Unfreeze all open PRs
        run: |
          echo "🔓 MANUAL UNFREEZE INITIATED by ${{ github.actor }}"
          echo "Finding all open PRs..."

          PR_COUNT=$(gh pr list --repo ${{ github.repository }} --state open --json number --jq 'length')
          echo "Found $PR_COUNT open PRs"

          if [[ "$PR_COUNT" -eq 0 ]]; then
            echo "ℹ️  No open PRs to unfreeze"
            exit 0
          fi

          UNFROZEN=0
          FAILED=0

          for PR in $(gh pr list --repo ${{ github.repository }} --state open --json number --jq '.[].number'); do
            echo "Processing PR $PR..."
            SHA=$(gh pr view $PR --repo ${{ github.repository }} --json headRefOid --jq '.headRefOid')

            if gh api repos/${{ github.repository }}/statuses/$SHA \
              -f state=success \
              -f context="release-gate" \
              -f description="Manual unfreeze by ${{ github.actor }}" 2>/dev/null; then
              echo "✅ Unfroze PR $PR (SHA: ${SHA:0:7})"
              UNFROZEN=$((UNFROZEN + 1))
            else
              echo "⚠️  Failed to unfreeze PR $PR"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Summary:"
          echo "   Total PRs: $PR_COUNT"
          echo "   ✅ Unfrozen: $UNFROZEN"
          echo "   ❌ Failed: $FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [[ "$FAILED" -gt 0 ]]; then
            echo "⚠️  Some PRs failed to unfreeze. Check logs above."
            exit 1
          fi

          echo "✅ All PRs successfully unfrozen"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post summary
        if: always()
        run: |
          echo "🔓 Manual Unfreeze Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All open PRs have been unfrozen (release-gate set to success)." >> $GITHUB_STEP_SUMMARY
