name: Approvals

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  require-2-approvals-on-big-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Check diff size and approval count
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            // Get PR diff stats
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const totalChanges = pr.additions + pr.deletions;

            // Get PR reviews
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: prNumber,
            });

            // Count unique users who approved
            const approvedUsers = new Set(
              reviews
                .filter(review => review.state === "APPROVED")
                .map(review => review.user.login)
            );

            const approvalCount = approvedUsers.size;

            console.log(`Total changes: ${totalChanges}`);
            console.log(`Approvals: ${approvalCount}`);

            if (totalChanges >= 1000 && approvalCount < 2) {
              core.setFailed(
                `PR has ${totalChanges} changed lines and only ${approvalCount} approval(s). Requires at least 2 approvals to pass.`
              );
            } else {
              console.log("PR only requires 1 approval.");
            }
