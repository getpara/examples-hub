name: Merge Freeze Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose an action: freeze or unfreeze"
        required: true
        default: "freeze"
        type: choice
        options:
          - freeze
          - unfreeze

jobs:
  manual-freeze-control:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: List open PRs and apply freeze/unfreeze
        run: |
          action="${{ github.event.inputs.action }}"
          echo "Action selected: $action"
          
          # Get all open PRs with their numbers
          pr_numbers=$(gh pr list --state open --json number --jq '.[].number')
          
          for pr_number in $pr_numbers; do
            echo "Processing PR #$pr_number"
            
            if [[ "$action" == "freeze" ]]; then
              # Check if this PR already has the merge-freeze label
              label_count=$(gh pr view "$pr_number" --json labels --jq 'if .labels | length > 0 then [.labels[].name] | map(select(. == "merge-freeze")) | length else 0 end')
              
              if [[ "$label_count" -gt 0 ]]; then
                echo "PR #$pr_number already has merge-freeze label, skipping"
              else
                echo "Adding merge-freeze label to PR #$pr_number"
                gh pr edit "$pr_number" --add-label "merge-freeze"
              fi
            elif [[ "$action" == "unfreeze" ]]; then
              # Check if this PR has the merge-freeze label
              label_count=$(gh pr view "$pr_number" --json labels --jq 'if .labels | length > 0 then [.labels[].name] | map(select(. == "merge-freeze")) | length else 0 end')
              
              if [[ "$label_count" -gt 0 ]]; then
                echo "Removing merge-freeze label from PR #$pr_number"
                gh pr edit "$pr_number" --remove-label "merge-freeze"
              else
                echo "PR #$pr_number doesn't have merge-freeze label, skipping"
              fi
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
