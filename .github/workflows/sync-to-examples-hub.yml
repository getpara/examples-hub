name: Sync to examples-hub

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name for the sync (optional - auto-generated if not provided)'
        required: false
        type: string

jobs:
  sync-to-examples-hub:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout web-sdk
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 2.0.0-alpha
          token: ${{ secrets.EXAMPLES_HUB_SYNC_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "para-bot"
          git config --global user.email "bot@usepara.com"

      - name: Add examples-hub remote
        run: |
          git remote add examples-hub https://x-access-token:${{ secrets.EXAMPLES_HUB_SYNC_TOKEN }}@github.com/getpara/examples-hub.git
          git fetch examples-hub

      - name: Generate branch name
        id: branch_info
        run: |
          if [ -n "${{ inputs.branch_name }}" ]; then
            BRANCH_NAME="${{ inputs.branch_name }}"
          else
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BRANCH_NAME="sync-from-web-sdk-${TIMESTAMP}"
          fi
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Using branch name: $BRANCH_NAME"

      - name: Get latest commit info
        id: commit_info
        run: |
          LAST_COMMIT=$(git rev-parse HEAD)
          if [ -z "$LAST_COMMIT" ]; then
            echo "Error: Unable to get HEAD commit"
            exit 1
          fi
          COMMIT_MSG=$(git log -1 --format="%s" $LAST_COMMIT)
          COMMIT_AUTHOR=$(git log -1 --format="%an" $LAST_COMMIT)
          COMMIT_DATE=$(git log -1 --format="%ad" --date=short $LAST_COMMIT)
          echo "commit_sha=$LAST_COMMIT" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "commit_date=$COMMIT_DATE" >> $GITHUB_OUTPUT

      - name: Check for changes in examples-hub
        id: check_changes
        run: |
          if git diff --quiet examples-hub/2.0.0-alpha...HEAD -- examples-hub/ 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in examples-hub/ directory"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in examples-hub/ directory"
          fi

      - name: Push changes to examples-hub
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          git push examples-hub --delete "$BRANCH_NAME" 2>/dev/null || true
          git subtree push --prefix=examples-hub examples-hub $BRANCH_NAME

      - name: Create Pull Request in examples-hub
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXAMPLES_HUB_SYNC_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          COMMIT_SHA="${{ steps.commit_info.outputs.commit_sha }}"
          COMMIT_MSG="${{ steps.commit_info.outputs.commit_msg }}"
          COMMIT_AUTHOR="${{ steps.commit_info.outputs.commit_author }}"
          COMMIT_DATE="${{ steps.commit_info.outputs.commit_date }}"

          PR_BODY=$(cat <<EOF
          ## 🔄 Automated Sync from web-sdk

          This PR contains changes synced from the web-sdk repository.

          ### Source Information
          - **Repository**: capsule-org/web-sdk
          - **Branch**: 2.0.0-alpha
          - **Commit**: ${COMMIT_SHA:0:8}
          - **Author**: $COMMIT_AUTHOR
          - **Date**: $COMMIT_DATE

          ### Original Commit Message
          $COMMIT_MSG

          ### Changes
          Changes were made to the examples-hub/ directory in web-sdk and are being synced to this repository.
          EOF
          )

          gh pr create \
            --repo getpara/examples-hub \
            --base 2.0.0-alpha \
            --head "$BRANCH_NAME" \
            --title "sync: $COMMIT_MSG" \
            --body "$PR_BODY" || {
              echo "Failed to create PR. It may already exist or there might be an authentication issue."
              exit 1
            }

      - name: Output PR URL
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXAMPLES_HUB_SYNC_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          PR_URL=$(gh pr list --repo getpara/examples-hub --head "$BRANCH_NAME" --json url --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            echo "✅ Pull request created successfully!"
            echo "🔗 PR URL: $PR_URL"
          else
            echo "⚠️ Could not retrieve PR URL"
          fi
