  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Environment-specific configuration -->
    <script>
      // Check if this is a production deployment
      const isProduction = '%VITE_CAPSULE_API_KEY%' === '533efae5f7427d73cf9c1cc7e32b627b';
      
      if (!isProduction) {
        // Update robots meta for non-production
        const robotsMeta = document.querySelector('meta[name="robots"]');
        if (robotsMeta) {
          robotsMeta.content = 'noindex, nofollow';
        }
        
        // Determine environment prefix
        const isSandbox = '%VITE_CAPSULE_API_KEY%' === 'dd4d7071735029ce97dce17969e82ad6';
        const envPrefix = isSandbox ? '[SANDBOX] ' : '[NON-PROD] ';
        
        // Add environment prefix to title
        const title = document.querySelector('title');
        if (title) {
          title.textContent = envPrefix + title.textContent;
        }
        
        // Update page title meta tag
        const titleMeta = document.querySelector('meta[name="title"]');
        if (titleMeta) {
          titleMeta.content = envPrefix + titleMeta.content;
        }
        
        // Update Open Graph title
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) {
          ogTitle.content = envPrefix + ogTitle.content;
        }
        
        // Update Twitter title
        const twitterTitle = document.querySelector('meta[property="twitter:title"]');
        if (twitterTitle) {
          twitterTitle.content = envPrefix + twitterTitle.content;
        }
        
        // Update site name
        const ogSiteName = document.querySelector('meta[property="og:site_name"]');
        if (ogSiteName) {
          ogSiteName.content = envPrefix + ogSiteName.content;
        }
        
        // Update app title
        const appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appTitle) {
          appTitle.content = envPrefix + appTitle.content;
        }
        
        // Remove canonical URL for non-production
        const canonicalLink = document.querySelector('link[rel="canonical"]');
        if (canonicalLink) {
          canonicalLink.remove();
        }
        
        // Remove JSON-LD for non-production
        const jsonLdScript = document.querySelector('script[type="application/ld+json"]');
        if (jsonLdScript) {
          jsonLdScript.remove();
        }
      }
    </script>
