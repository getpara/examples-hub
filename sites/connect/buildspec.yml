version: 0.2

env:
  variables:
    NODE_VERSION: "22.17.0"

phases:
  install:
    runtime-versions:
      nodejs: 22.17.0
    commands:
      - echo "Checking environment variables:"
      - env
      - echo "Updating package lists..."
      - apt-get update
      - echo "Installing Yarn dependencies..."
      - yarn install --frozen-lockfile
  build:
    commands:
      - echo "Navigating to $REPO_DIR_PATH and building site for $ENV..."
      - cd $REPO_DIR_PATH
      - export NODE_OPTIONS="--max-old-space-size=4096"
      - yarn build-$ENV
      - echo "Deploying site to s3://$S3_BUCKET_NAME for $ENV..."
      - aws s3 sync $BUILD_PATH s3://$S3_BUCKET_NAME --delete
      - |
        echo "CloudFront cache check for $ENV..."
        if [ "$ENV" != "sandbox" ]; then
          echo "Invalidating cloudfront cache $CLOUDFRONT_DISTRIBUTION_ID for $ENV..."
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/index.html"
        else
          echo "Skipping CloudFront invalidation (ENV=$ENV)"
        fi
      - echo "Deploy to $ENV finished."
