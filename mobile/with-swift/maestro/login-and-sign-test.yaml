appId: com.usecapsule.example.swift
---
- clearState
- launchApp
- waitForAnimationToEnd

# Wait for auth screen
- assertVisible: "Sign Up or Log In"

# Generate random test email
- evalScript: ${output.email = 'maestro-' + Date.now() + '@test.getpara.com'}

# Enter email
- tapOn: "Enter email or phone"
- inputText: "${output.email}"

# Tap continue to trigger ASWebAuth
- tapOn: "Continue"

# Handle ASWebAuth consent dialog
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
- tapOn: "Continue"

# Wait for OTP page
- extendedWaitUntil:
    visible: "Send new code"
    timeout: 15000

# The hosted portal's sandbox/beta environment banner sits in normal flow above
# the step and pushes the OTP boxes down. Dismiss it so the focus tap below
# lands on the first code box instead of the "Verify Email" title.
# Scope "Dismiss" to the banner (above the OTP prompt): iOS can expose another
# "Dismiss" element lower on screen during the sheet transition.
- runFlow:
    when:
      visible:
        text: "Dismiss"
        above: "Please enter the code we sent to.*"
    commands:
      - tapOn:
          text: "Dismiss"
          above: "Please enter the code we sent to.*"
      - waitForAnimationToEnd

# Tap on OTP input field for keyboard focus
- tapOn:
    point: "15%,35%"
- waitForAnimationToEnd

# Enter OTP digits
- inputText: "1"
- waitForAnimationToEnd
- inputText: "2"
- waitForAnimationToEnd
- inputText: "3"
- waitForAnimationToEnd
- inputText: "4"
- waitForAnimationToEnd
- inputText: "5"
- waitForAnimationToEnd
- inputText: "6"

# Wait for wallets screen
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Approve"
    commands:
      - tapOn: "Approve"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 30000
- assertVisible: "Wallets"

# Create an EVM wallet when the authenticated user does not have one yet
- runFlow:
    when:
      visible: "Create Your First Wallet"
    commands:
      - tapOn:
          id: "createFirstWalletButton"
      - tapOn:
          id: "evmWalletButton"

# Open the EVM wallet
- extendedWaitUntil:
    visible:
      id: "walletCell_EVM"
    timeout: 30000
- tapOn:
    id: "walletCell_EVM"
- waitForAnimationToEnd

# Sign a message
- tapOn: "Enter a message to sign"
- inputText: "Hello from Para!"
- pressKey: "Enter"
- tapOn: "Sign Message (EIP-191)"

# Wait for signature result
- extendedWaitUntil:
    visible: "Message Signed"
    timeout: 15000
- assertVisible: "Message Signed"
