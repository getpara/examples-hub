appId: com.usecapsule.example.swift
---
- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL_PREFIX: maestro

# Wait for wallets screen
- runFlow:
    when:
      visible: "Approve"
    commands:
      - tapOn: "Approve"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 30000
- assertVisible: "Wallets"

# Create an EVM wallet when the authenticated user does not have one yet
- runFlow:
    when:
      visible: "Create Your First Wallet"
    commands:
      - tapOn:
          id: "createFirstWalletButton"
      - tapOn:
          id: "evmWalletButton"

# Open the EVM wallet
- extendedWaitUntil:
    visible:
      id: "walletCell_EVM"
    timeout: 30000
- tapOn:
    id: "walletCell_EVM"
- waitForAnimationToEnd

# Sign a message
- tapOn: "Enter a message to sign"
- inputText: "Hello from Para!"
- pressKey: "Enter"
- tapOn: "Sign Message (EIP-191)"

# Wait for signature result
- extendedWaitUntil:
    visible: "Message Signed"
    timeout: 15000
- assertVisible: "Message Signed"
