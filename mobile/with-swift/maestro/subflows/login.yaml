appId: com.usecapsule.example.swift
---
# Signs up a fresh test user and enters the OTP on Para's hosted page.
# Env: EMAIL_PREFIX (required). LEGACY (optional): sign in through the legacy
# initiateAuthFlow button instead of authenticateWithEmailOrPhone.

- clearState
- launchApp
- waitForAnimationToEnd

# Wait for auth screen
- assertVisible: "Sign Up or Log In"

# Enter a random test email (test emails accept any 6-digit code)
- evalScript: ${output.email = EMAIL_PREFIX + '-' + Date.now() + '@test.getpara.com'}
- tapOn: "Enter email or phone"
- inputText: "${output.email}"

# Tap continue to trigger ASWebAuth
- tapOn: "${typeof LEGACY === 'undefined' ? 'Continue' : 'Continue with legacy auth'}"

# The web auth sheet and its consent dialog both show "Cancel". iOS skips the
# dialog once consent has persisted on the simulator, so its tap is optional.
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 30000
- tapOn:
    text: "Continue"
    optional: true

# Wait for OTP page
- extendedWaitUntil:
    visible: "Send new code"
    timeout: 30000

# Focus the code input by its position in the step, not a fixed screen point,
# and leave the env banner alone: its 16pt close icon moves while iOS scrolls
# the autofocused input into view, so a tap on it can open Safari's Format
# Options menu instead (ENG-7833).
- waitForAnimationToEnd
- tapOn:
    below: "Please enter the code we sent to.*"
    above: "Send new code"
- waitForAnimationToEnd

# Enter OTP digits
- inputText: "1"
- waitForAnimationToEnd
- inputText: "2"
- waitForAnimationToEnd
- inputText: "3"
- waitForAnimationToEnd
- inputText: "4"
- waitForAnimationToEnd
- inputText: "5"
- waitForAnimationToEnd
- inputText: "6"
- waitForAnimationToEnd
