appId: com.usecapsule.example.swift
---
- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL_PREFIX: maestro-stellar

- runFlow:
    when:
      visible: "Approve"
    commands:
      - tapOn: "Approve"

- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 30000

- runFlow:
    when:
      visible: "Create Your First Wallet"
    commands:
      - tapOn:
          id: "createFirstWalletButton"
      - tapOn:
          id: "stellarWalletButton"

- runFlow:
    when:
      visible: "Add Wallet"
    commands:
      - tapOn:
          id: "addWalletButton"
      - tapOn:
          id: "stellarWalletButton"

- extendedWaitUntil:
    visible: "STELLAR"
    timeout: 30000
- tapOn:
    id: "walletCell_STELLAR"
- extendedWaitUntil:
    visible: "Stellar Wallet"
    timeout: 10000

- tapOn: "Sign Transaction"
- extendedWaitUntil:
    visible: "Transaction Signed"
    timeout: 20000
- assertVisible: "Transaction Signed"
