appId: com.usecapsule.example.swift
---
- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL_PREFIX: maestro-aa

# Permissions consent screen may appear depending on partner policy state.
- extendedWaitUntil:
    visible: "Approve"
    timeout: 15000
- tapOn: "Approve"

# Wait for wallets screen
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 30000
- assertVisible: "Wallets"

# Tap on EVM wallet card
- tapOn: "EVM"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "EVM Wallet"
    timeout: 10000

# Scroll down to reveal the Account Abstraction section
- scrollUntilVisible:
    element:
      text: "Open Smart Account"
    direction: DOWN
    timeout: 10000

# Open the Smart Account screen
- tapOn: "Open Smart Account"
- waitForAnimationToEnd

# Wait for Smart Account screen to render with both addresses
- extendedWaitUntil:
    visible: "Smart Account"
    timeout: 10000
- assertVisible: "EOA (Para Wallet)"
- extendedWaitUntil:
    visible: "Smart Account (Alchemy Modular Account)"
    timeout: 30000

# Trigger the gasless transaction
- tapOn: "Send Gasless Transaction"

# UserOp inclusion on Sepolia can take 75s+; the SDK has a 120s timeout
- extendedWaitUntil:
    visible: "Transaction sent successfully!"
    timeout: 120000
- assertVisible: "Transaction sent successfully!"
- assertVisible: "View on Etherscan"
