appId: com.usecapsule.example.flutter
# Shared sign-in steps: enter a fresh test email, tap SIGN_IN_BUTTON, and enter
# the code on Para's hosted page. Callers continue from the page that follows.
#
# Env: EMAIL_PREFIX, SIGN_IN_BUTTON ("Continue" runs authenticateWithEmailOrPhone,
# "Continue with legacy auth" runs initiateAuthFlow and the stage-based methods).
---
- clearState
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Close app"
          optional: true
      - waitForAnimationToEnd

# Logout if already signed in
- tapOn:
    text: "Logout"
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Close app"
          optional: true
      - waitForAnimationToEnd

# Wait for auth screen
- extendedWaitUntil:
    visible: "Sign Up or Log In"
    timeout: 10000

# Generate random test email
- evalScript: ${output.email = EMAIL_PREFIX + Date.now() + '@test.getpara.com'}

# Switch to email tab and enter email
- tapOn: "Email"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: "74%,63%"
      - waitForAnimationToEnd
- tapOn: "Email address"
- inputText: "${output.email}"
- pressKey: "Enter"

# Tap the sign-in button to trigger ASWebAuth
- tapOn: "${SIGN_IN_BUTTON}"
- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
            - waitForAnimationToEnd

# Handle the iOS ASWebAuth consent dialog. It is skipped once consent has
# persisted on the simulator, so wait for it without requiring it.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Cancel"
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible: "Cancel"
          commands:
            - tapOn: "Continue"

# Wait for OTP page
- extendedWaitUntil:
    visible: "Send new code"
    timeout: 30000

# Android only: dismiss the env banner. Later fixed-point taps in the Custom
# Tab (e.g. the 50%,52% consent Approve) assume the banner is gone. iOS skips
# it: there the close icon moves while the autofocused input scrolls into
# view, and the tap can open Safari's Format Options menu instead (ENG-7833).
- runFlow:
    when:
      platform: Android
      visible:
        text: "Dismiss"
        above: "Please enter the code we sent to.*"
    commands:
      - tapOn:
          text: "Dismiss"
          above: "Please enter the code we sent to.*"
      - waitForAnimationToEnd

# Focus the code input by its position in the step, not a fixed screen point,
# so it lands whether or not the banner is still above it (ENG-7833).
- waitForAnimationToEnd
- tapOn:
    below: "Please enter the code we sent to.*"
    above: "Send new code"
- waitForAnimationToEnd

# Enter OTP digits
- inputText: "1"
- waitForAnimationToEnd
- inputText: "2"
- waitForAnimationToEnd
- inputText: "3"
- waitForAnimationToEnd
- inputText: "4"
- waitForAnimationToEnd
- inputText: "5"
- waitForAnimationToEnd
- inputText: "6"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: "Enter"
      - waitForAnimationToEnd
