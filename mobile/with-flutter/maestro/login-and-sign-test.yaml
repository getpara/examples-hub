appId: com.usecapsule.example.flutter
---
- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL_PREFIX: "maestro-"
      SIGN_IN_BUTTON: "Continue"
- runFlow:
    when:
      platform: Android
    commands:
      # Chrome Custom Tabs can stay visually on top after the custom-scheme
      # callback succeeds. Close it so Maestro targets the Flutter app again.
      - tapOn:
          point: "6%,9%"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Approve"
    commands:
      - tapOn: "Approve"

# Wait for wallets screen
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 30000
- assertVisible: "Wallets"

# Create an EVM wallet. Para auth v2 creates the
# project's wallets during signup, so this only runs when there are none yet.
- runFlow:
    when:
      visible: "Create Your First Wallet"
    commands:
      - tapOn: "Create Your First Wallet"
      - extendedWaitUntil:
          visible: "Select Wallet Type"
          timeout: 10000
      - tapOn: "evm"

# Wait for wallet creation
- extendedWaitUntil:
    visible: "0x.*"
    timeout: 30000
- tapOn:
    text: "0x.*"
- waitForAnimationToEnd

# Sign a message
- tapOn: "Enter a message to sign"
- inputText: "Hello from Para!"
- pressKey: "Enter"
- tapOn: "Sign Message (EIP-191)"

# Wait for signature result
- extendedWaitUntil:
    visible: "Message Signed"
    timeout: 15000
- assertVisible: "Message Signed"
