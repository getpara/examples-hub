appId: com.usecapsule.example.flutter
---
- clearState
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Close app"
          optional: true
      - waitForAnimationToEnd

# Logout if already signed in
- tapOn:
    text: "Logout"
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Close app"
          optional: true
      - waitForAnimationToEnd

# Wait for auth screen
- extendedWaitUntil:
    visible: "Sign Up or Log In"
    timeout: 10000

# Generate random test email
- evalScript: ${output.email = 'maestro-' + Date.now() + '@test.getpara.com'}

# Switch to email tab and enter email
- tapOn: "Email"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: "74%,63%"
      - waitForAnimationToEnd
- tapOn: "Email address"
- inputText: "${output.email}"
- pressKey: "Enter"

# Tap continue to trigger ASWebAuth
- tapOn: "Continue"
- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
            - waitForAnimationToEnd

# Handle ASWebAuth consent dialog
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Cancel"
          timeout: 10000
      - tapOn: "Continue"

# Wait for OTP page
- extendedWaitUntil:
    visible: "Send new code"
    timeout: 30000

# Tap on OTP input field for keyboard focus
- tapOn:
    point: "15%,35%"
- waitForAnimationToEnd

# Enter OTP digits
- inputText: "1"
- waitForAnimationToEnd
- inputText: "2"
- waitForAnimationToEnd
- inputText: "3"
- waitForAnimationToEnd
- inputText: "4"
- waitForAnimationToEnd
- inputText: "5"
- waitForAnimationToEnd
- inputText: "6"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: "Enter"
      - waitForAnimationToEnd
      # Chrome Custom Tabs can stay visually on top after the custom-scheme
      # callback succeeds. Close it so Maestro targets the Flutter app again.
      - tapOn:
          point: "6%,9%"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Approve"
    commands:
      - tapOn: "Approve"

# Wait for wallets screen
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 30000
- assertVisible: "Wallets"

# Create an EVM wallet
- tapOn: "Create Your First Wallet"
- extendedWaitUntil:
    visible: "Select Wallet Type"
    timeout: 10000
- tapOn: "evm"

# Wait for wallet creation
- extendedWaitUntil:
    visible: "0x.*"
    timeout: 30000
- tapOn:
    text: "0x.*"
- waitForAnimationToEnd

# Sign a message
- tapOn: "Enter a message to sign"
- inputText: "Hello from Para!"
- pressKey: "Enter"
- tapOn: "Sign Message (EIP-191)"

# Wait for signature result
- extendedWaitUntil:
    visible: "Message Signed"
    timeout: 15000
- assertVisible: "Message Signed"
