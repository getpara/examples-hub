appId: com.usecapsule.example.flutter
---
- clearState
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Close app"
          optional: true
      - waitForAnimationToEnd

# Logout if already signed in
- tapOn:
    text: "Logout"
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Close app"
          optional: true
      - waitForAnimationToEnd

# Wait for auth screen
- extendedWaitUntil:
    visible: "Sign Up or Log In"
    timeout: 10000

# Generate random test email
- evalScript: ${output.email = 'maestro-aa-' + Date.now() + '@test.getpara.com'}

# Switch to email tab and enter email
- tapOn: "Email"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: "74%,63%"
      - waitForAnimationToEnd
- tapOn: "Email address"
- inputText: "${output.email}"
- pressKey: "Enter"

# Tap continue to trigger ASWebAuth
- tapOn: "Continue"
- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
            - waitForAnimationToEnd

# Handle the iOS ASWebAuth consent dialog when it appears. Android usually
# goes straight to the browser/OTP flow, and iOS may skip this after consent
# has persisted on the simulator.
- runFlow:
    when:
      platform: iOS
      visible: "Cancel"
    commands:
      - tapOn: "Continue"

# Wait for OTP page
- extendedWaitUntil:
    visible: "Send new code"
    timeout: 30000

# Tap on OTP input field for keyboard focus
- tapOn:
    point: "15%,35%"
- waitForAnimationToEnd

# Enter OTP digits (test emails accept any 6-digit code)
- inputText: "1"
- waitForAnimationToEnd
- inputText: "2"
- waitForAnimationToEnd
- inputText: "3"
- waitForAnimationToEnd
- inputText: "4"
- waitForAnimationToEnd
- inputText: "5"
- waitForAnimationToEnd
- inputText: "6"

- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: "Enter"
      - waitForAnimationToEnd

- runFlow:
    when:
      platform: Android
      visible: "Open with"
    commands:
      - tapOn:
          point: "20%,82%"
      - tapOn:
          text: "Just once"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
      visible: "Just once"
    commands:
      - tapOn:
          text: "Para Flutter"
          index: 0
      - tapOn:
          text: "Just once"
          optional: true
      - waitForAnimationToEnd

# Permissions consent screen should appear.
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,52%"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Approve"
          timeout: 15000
      - tapOn: "Approve"
- runFlow:
    when:
      platform: Android
      visible: "Just once"
    commands:
      - tapOn: "Just once"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      # Chrome Custom Tabs can stay visually on top after the custom-scheme
      # callback succeeds. Close it so Maestro targets the running app again.
      - tapOn:
          point: "6%,9%"
      - waitForAnimationToEnd

# Wait for wallets screen
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 30000
- assertVisible: "Wallets"

# Create an EVM wallet (smart account needs an EOA to sign)
- tapOn: "Create Your First Wallet"
- extendedWaitUntil:
    visible: "Select Wallet Type"
    timeout: 10000
- tapOn: "EVM"
- extendedWaitUntil:
    visible: "0x.*"
    timeout: 30000

# Open the Smart Account screen via the AppBar icon
- tapOn: "Smart Account"
- waitForAnimationToEnd

# Wait for Smart Account screen to render with both addresses
- extendedWaitUntil:
    visible: "Connected Wallets"
    timeout: 10000
- assertVisible: "EOA (Para Wallet)"
- extendedWaitUntil:
    visible: "Smart Account (Alchemy Modular Account)"
    timeout: 30000

# Trigger the gasless transaction
- tapOn: "Send Gasless Transaction"

# UserOp inclusion on Sepolia can take 75s+; the SDK has a 120s timeout
- extendedWaitUntil:
    visible: "Transaction sent successfully!"
    timeout: 120000
- assertVisible: "Transaction sent successfully!"
- assertVisible: "View on Etherscan"
