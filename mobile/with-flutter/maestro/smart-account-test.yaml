appId: com.usecapsule.example.flutter
---
- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL_PREFIX: "maestro-aa-"
      SIGN_IN_BUTTON: "Continue"

- runFlow:
    when:
      platform: Android
      visible: "Open with"
    commands:
      - tapOn:
          point: "20%,82%"
      - tapOn:
          text: "Just once"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
      visible: "Just once"
    commands:
      - tapOn:
          text: "Para Flutter"
          index: 0
      - tapOn:
          text: "Just once"
          optional: true
      - waitForAnimationToEnd

# Permissions consent screen should appear.
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,52%"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Approve"
          timeout: 15000
      - tapOn: "Approve"
- runFlow:
    when:
      platform: Android
      visible: "Just once"
    commands:
      - tapOn: "Just once"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      # Chrome Custom Tabs can stay visually on top after the custom-scheme
      # callback succeeds. Close it so Maestro targets the running app again.
      - tapOn:
          point: "6%,9%"
      - waitForAnimationToEnd

# Wait for wallets screen
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 30000
- assertVisible: "Wallets"

# Create an EVM wallet (smart account needs an EOA to sign). Para auth v2 creates the
# project's wallets during signup, so this only runs when there are none yet.
- runFlow:
    when:
      visible: "Create Your First Wallet"
    commands:
      - tapOn: "Create Your First Wallet"
      - extendedWaitUntil:
          visible: "Select Wallet Type"
          timeout: 10000
      - tapOn: "EVM"
- extendedWaitUntil:
    visible: "0x.*"
    timeout: 30000

# Open the Smart Account screen via the AppBar icon
- tapOn: "Smart Account"
- waitForAnimationToEnd

# Wait for Smart Account screen to render with both addresses
- extendedWaitUntil:
    visible: "Connected Wallets"
    timeout: 10000
- assertVisible: "EOA (Para Wallet)"
- extendedWaitUntil:
    visible: "Smart Account (Alchemy Modular Account)"
    timeout: 30000

# Trigger the gasless transaction
- tapOn: "Send Gasless Transaction"

# UserOp inclusion on Sepolia can take 75s+; the SDK has a 120s timeout
- extendedWaitUntil:
    visible: "Transaction sent successfully!"
    timeout: 120000
- assertVisible: "Transaction sent successfully!"
- assertVisible: "View on Etherscan"
