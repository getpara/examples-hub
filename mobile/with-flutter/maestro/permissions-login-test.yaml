appId: com.usecapsule.example.flutter
---
# Tests the login flow for partners with policiesEnabled + configured policies.
# Verifies that the permissions consent screen appears after OTP and that
# signing works after the user approves.
#
# Requires: partner with policiesEnabled=true and at least one policy (e.g. Message Signing).

- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL_PREFIX: "maestro-perm-"
      SIGN_IN_BUTTON: "Continue"

- runFlow:
    when:
      platform: Android
      visible: "Open with"
    commands:
      - tapOn:
          point: "20%,82%"
      - tapOn:
          text: "Just once"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
      visible: "Just once"
    commands:
      - tapOn:
          text: "Para Flutter"
          index: 0
      - tapOn:
          text: "Just once"
          optional: true
      - waitForAnimationToEnd

# Permissions consent screen should appear
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,52%"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Approve"
          timeout: 15000
      - tapOn: "Approve"
- runFlow:
    when:
      platform: Android
      visible: "Just once"
    commands:
      - tapOn: "Just once"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      # Chrome Custom Tabs can stay visually on top after the custom-scheme
      # callback succeeds. Close it so Maestro targets the running app again.
      - tapOn:
          point: "6%,9%"
      - waitForAnimationToEnd

# Wait for wallets screen
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 30000
- assertVisible: "Wallets"

# Create an EVM wallet. Para auth v2 creates the
# project's wallets during signup, so this only runs when there are none yet.
- runFlow:
    when:
      visible: "Create Your First Wallet"
    commands:
      - tapOn: "Create Your First Wallet"
      - extendedWaitUntil:
          visible: "Select Wallet Type"
          timeout: 10000
      - tapOn: "evm"

# Wait for wallet creation
- extendedWaitUntil:
    visible: "0x.*"
    timeout: 30000
- tapOn:
    text: "0x.*"
- waitForAnimationToEnd

# Sign a message (should succeed without popup since permissions were granted)
- tapOn: "Enter a message to sign"
- inputText: "Hello from Para!"
- pressKey: "Enter"
- tapOn: "Sign Message (EIP-191)"

# Wait for signature result
- extendedWaitUntil:
    visible: "Message Signed"
    timeout: 15000
- assertVisible: "Message Signed"
- tapOn: "OK"

# Return to wallets and create a Stellar wallet through the same Add Wallet flow
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wallets"
    timeout: 10000
- tapOn: "Add Wallet"
- extendedWaitUntil:
    visible: "Select Wallet Type"
    timeout: 10000
- tapOn: "STELLAR"
- extendedWaitUntil:
    visible: "G.*"
    timeout: 30000

# Open Stellar wallet and verify bridge-backed message signing works
- tapOn: "G.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Stellar Wallet"
    timeout: 10000
- assertVisible: "Stellar Wallet"
- assertVisible: "G.*"
- tapOn: "Enter a message to sign"
- inputText: "Hello from Stellar!"
- pressKey: "Enter"
- tapOn: "Sign Message (Ed25519)"
- extendedWaitUntil:
    visible: "Message Signed"
    timeout: 15000
- assertVisible: "Message Signed"
